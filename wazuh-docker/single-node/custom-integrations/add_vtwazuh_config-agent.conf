
<!-- VirusTotal & Wazuh Integration -->
<ossec_config>
  <syscheck>
    <disabled>no</disabled>
    <directories report_changes="yes" whodata="yes" realtime="yes">/root</directories>
    <directories report_changes="yes" whodata="yes" realtime="yes">$USECASE_DIR</directories>
  </syscheck>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/secure</location>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>journalctl -u ssh -u sshd --since "-5 minutes" --no-pager -o short-iso</command>
    <alias>host ssh authentication journal</alias>
    <frequency>60</frequency>
  </localfile>
</ossec_config>
